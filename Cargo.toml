[package]
name = "pctl"
version = "0.1.1"
edition = "2024"
description = "Declarative repository operations"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
toml = "0.9"
signal-hook = "0.3"
libc = "0.2"
sha2 = "0.11"
hex = "0.4"
url = "2"
clap_complete = "4"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
