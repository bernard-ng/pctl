name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Test
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked --bin pctl --target ${{ matrix.target }}

      - name: Package executable
        run: tar -C target/${{ matrix.target }}/release -czf pctl-linux-${{ matrix.arch }}.tar.gz pctl

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: pctl-linux-${{ matrix.arch }}
          path: pctl-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download executable artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --generate-notes --verify-tag
          fi
